services:
  - type: web
    name: twin-torque-site
    runtime: static
    buildCommand: echo "Static HTML site"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

